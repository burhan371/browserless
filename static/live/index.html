<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browserless live browser</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: #111827;
        color: #f9fafb;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #1f2937;
      }
      #status {
        color: #9ca3af;
      }
      #status[data-state='connected'] {
        color: #86efac;
      }
      #status[data-state='error'] {
        color: #fca5a5;
      }
      main {
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 12px;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: #fff;
        outline: none;
      }
      #message {
        padding: 20px;
        text-align: center;
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Browserless live browser</strong>
      <span id="status" role="status" aria-live="polite">Connecting…</span>
    </header>
    <main>
      <canvas
        id="browser"
        tabindex="0"
        aria-label="Remote browser. Click here to interact."
      ></canvas>
      <div id="message" hidden></div>
    </main>
    <script>
      (() => {
        const canvas = document.querySelector('#browser');
        const context = canvas.getContext('2d');
        const status = document.querySelector('#status');
        const message = document.querySelector('#message');
        const params = new URLSearchParams(location.search);
        const endpoint = params.get('ws');
        let commandId = 0;
        let cssWidth = 0;
        let cssHeight = 0;

        const showError = (text) => {
          status.dataset.state = 'error';
          status.textContent = 'Disconnected';
          message.textContent = text;
          message.hidden = false;
          canvas.hidden = true;
        };

        if (!endpoint) {
          showError(
            'The remote browser URL is missing its WebSocket endpoint.',
          );
          return;
        }

        let browserSocket;
        try {
          const remote = new URL(endpoint);
          if (!['ws:', 'wss:'].includes(remote.protocol)) throw new Error();
          browserSocket = new WebSocket(remote);
        } catch {
          showError('The remote browser WebSocket endpoint is invalid.');
          return;
        }

        const send = (method, commandParams = {}) => {
          if (browserSocket.readyState !== WebSocket.OPEN) return;
          browserSocket.send(
            JSON.stringify({
              id: ++commandId,
              method,
              params: commandParams,
            }),
          );
        };

        browserSocket.addEventListener('open', () => {
          status.dataset.state = 'connected';
          status.textContent = 'Connected — click the page to interact';
          send('Page.enable');
          send('Runtime.evaluate', {
            expression: '({width: innerWidth, height: innerHeight})',
            returnByValue: true,
          });
          send('Page.startScreencast', {
            format: 'jpeg',
            quality: 75,
            maxWidth: 1600,
            maxHeight: 1200,
          });
        });

        browserSocket.addEventListener('message', (event) => {
          let payload;
          try {
            payload = JSON.parse(event.data);
          } catch {
            return;
          }

          if (payload.id && payload.result?.result?.value) {
            const viewport = payload.result.result.value;
            cssWidth = viewport.width;
            cssHeight = viewport.height;
          }

          if (payload.method !== 'Page.screencastFrame') return;
          const frame = payload.params;
          const image = new Image();
          image.onload = () => {
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            context.drawImage(image, 0, 0);
            canvas.hidden = false;
            message.hidden = true;
          };
          image.src = `data:image/jpeg;base64,${frame.data}`;
          send('Page.screencastFrameAck', { sessionId: frame.sessionId });
        });

        browserSocket.addEventListener('close', () => {
          showError(
            'The Browserless session has ended. Start a new recording to reconnect.',
          );
        });
        browserSocket.addEventListener('error', () => {
          showError(
            'Could not connect to the remote browser. Check its network access and Browserless session.',
          );
        });

        const viewportPoint = (event) => {
          const rect = canvas.getBoundingClientRect();
          if (!cssWidth || !cssHeight || !rect.width || !rect.height)
            return null;
          const scale = Math.min(
            rect.width / cssWidth,
            rect.height / cssHeight,
          );
          const width = cssWidth * scale;
          const height = cssHeight * scale;
          const left = rect.left + (rect.width - width) / 2;
          const top = rect.top + (rect.height - height) / 2;
          return {
            x: (event.clientX - left) / scale,
            y: (event.clientY - top) / scale,
          };
        };

        canvas.addEventListener('pointerdown', (event) => {
          canvas.focus();
          const point = viewportPoint(event);
          if (!point) return;
          send('Input.dispatchMouseEvent', {
            ...point,
            type: 'mousePressed',
            button: event.button === 2 ? 'right' : 'left',
            clickCount: 1,
          });
        });
        canvas.addEventListener('pointerup', (event) => {
          const point = viewportPoint(event);
          if (!point) return;
          send('Input.dispatchMouseEvent', {
            ...point,
            type: 'mouseReleased',
            button: event.button === 2 ? 'right' : 'left',
            clickCount: 1,
          });
        });
        canvas.addEventListener('pointermove', (event) => {
          const point = viewportPoint(event);
          if (!point) return;
          send('Input.dispatchMouseEvent', { ...point, type: 'mouseMoved' });
        });
        canvas.addEventListener(
          'wheel',
          (event) => {
            const point = viewportPoint(event);
            if (!point) return;
            event.preventDefault();
            send('Input.dispatchMouseEvent', {
              ...point,
              type: 'mouseWheel',
              deltaX: event.deltaX,
              deltaY: event.deltaY,
            });
          },
          { passive: false },
        );
        canvas.addEventListener('contextmenu', (event) =>
          event.preventDefault(),
        );
        canvas.addEventListener('keydown', (event) => {
          event.preventDefault();
          const keyParams = {
            key: event.key,
            code: event.code,
            windowsVirtualKeyCode: event.keyCode,
            nativeVirtualKeyCode: event.keyCode,
            modifiers:
              (event.altKey ? 1 : 0) |
              (event.ctrlKey ? 2 : 0) |
              (event.metaKey ? 4 : 0) |
              (event.shiftKey ? 8 : 0),
          };
          send('Input.dispatchKeyEvent', {
            ...keyParams,
            type: 'keyDown',
            ...(event.key.length === 1 && {
              text: event.key,
              unmodifiedText: event.key,
            }),
          });
        });
        canvas.addEventListener('keyup', (event) => {
          event.preventDefault();
          send('Input.dispatchKeyEvent', {
            type: 'keyUp',
            key: event.key,
            code: event.code,
            windowsVirtualKeyCode: event.keyCode,
            nativeVirtualKeyCode: event.keyCode,
          });
        });
      })();
    </script>
  </body>
</html>
